<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 화면 미리보기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Noto Sans KR', sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .phone-frame { width: 360px; }
  .label {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin-bottom: 12px;
  }
  .phone {
    width: 360px;
    height: 720px;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }

  /* 상단 브랜드 + 하단 카드 */
  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #2F7CF6;
  }
  .top {
    padding: 72px 32px 36px;
    flex: 0 0 auto;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    color: white;
    line-height: 1.7;
  }
  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.72);
    margin-top: 10px;
  }
  .card {
    flex: 1;
    background: white;
    border-radius: 32px 32px 0 0;
    padding: 36px 28px 28px;
    display: flex;
    flex-direction: column;
  }
  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
  }
  .field {
    width: 100%; height: 50px;
    background: #F4F6F8;
    border: none;
    border-radius: 12px;
    padding: 0 16px;
    font-size: 14px;
    color: #333;
    margin-bottom: 18px;
    outline: none;
    font-family: inherit;
  }
  .btn-primary {
    width: 100%; height: 52px;
    background: #2F7CF6; color: white;
    border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    font-family: inherit;
  }
  .links {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 16px;
    font-size: 13px;
    color: #8C98A8;
  }
  .signup-row {
    margin-top: auto;
    text-align: center;
    font-size: 14px;
    color: #8C98A8;
    padding-top: 20px;
    border-top: 1px solid #F0F3F6;
  }
  .signup-row span {
    color: #2F7CF6;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="label">수정된 디자인 미리보기</div>
  <div class="phone">
    <div class="screen">
      <div class="top">
        <div class="title">안녕하세요,<br>다시 만났네요 👋</div>
        <div class="subtitle">오늘 하루를 기록해보세요</div>
      </div>
      <div class="card">
        <div class="field-label">이메일</div>
        <input class="field" placeholder="example@email.com" readonly>

        <div class="field-label">비밀번호</div>
        <input class="field" placeholder="비밀번호를 입력하세요" type="password" readonly>

        <button class="btn-primary">로그인</button>

        <div class="links">
          <span>아이디 찾기</span>
          <span>|</span>
          <span>비밀번호 찾기</span>
        </div>

        <div class="signup-row">
          아직 계정이 없으신가요? <span>회원가입</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
