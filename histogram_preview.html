<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히스토그램 디자인 비교</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Noto Sans KR', sans-serif;
    background: #f0f2f5;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  h1 { font-size: 13px; font-weight: 700; color: #888; letter-spacing: 0.08em; }
  .row { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
  .tag-current { color: #8c98a8; background: #e8eaed; }
  .tag-rec { color: #2F7CF6; background: #EEF3FF; }
  .tag-alt { color: #8c98a8; background: #f0f2f5; }
  .phone-label { font-size: 13px; font-weight: 700; color: #333; }
  .phone {
    width: 280px; background: #f5f7fa;
    border-radius: 28px; overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.13);
    padding: 16px;
  }
  .card {
    background: white; border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 14px; font-weight: 700; color: #1a1a2e;
    margin-bottom: 14px;
  }
  .legend {
    display: flex; gap: 14px; margin-bottom: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8c98a8; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  /* ─── 현재 스타일 ─── */
  .chart-current {
    position: relative; height: 140px;
  }
  .chart-current svg { width: 100%; height: 100%; }

  /* ─── A: 그라디언트 바 ─── */
  .chart-a {
    height: 150px; display: flex; align-items: flex-end;
    gap: 0; padding: 0 4px;
  }
  .bar-group-a {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .bars-a { display: flex; gap: 3px; align-items: flex-end; height: 110px; }
  .bar-a {
    width: 14px; border-radius: 6px 6px 3px 3px;
    position: relative; transition: opacity 0.2s;
  }
  .bar-a.exercise {
    background: linear-gradient(180deg, #60A5FA 0%, #BFDBFE 100%);
  }
  .bar-a.study {
    background: linear-gradient(180deg, #3D7BF4 0%, #93C5FD 100%);
  }
  .bar-label-a { font-size: 10px; color: #b0bac6; margin-top: 6px; }
  .axis-label-a {
    position: absolute; left: 0; top: 0;
    font-size: 9px; color: #d1d5db;
    display: flex; flex-direction: column;
    justify-content: space-between; height: 110px;
  }
  .chart-a-wrap { position: relative; }
  .grid-lines-a {
    position: absolute; top: 0; left: 0; right: 0;
    height: 110px; pointer-events: none;
  }
  .grid-line-a {
    position: absolute; left: 0; right: 0;
    height: 1px; background: #f3f4f6;
  }

  /* ─── B: 필 (캡슐) 스타일 ─── */
  .chart-b {
    height: 150px; display: flex; align-items: flex-end;
    padding: 0 2px;
  }
  .bar-group-b {
    flex: 1; display: flex; flex-direction: column;
    align-items: center;
  }
  .bars-b { display: flex; gap: 2px; align-items: flex-end; height: 108px; }
  .bar-b {
    width: 12px; border-radius: 999px;
    transition: opacity 0.2s;
  }
  .bar-b.exercise { background: #BFDBFE; }
  .bar-b.study { background: #3D7BF4; }
  .bar-b-track {
    width: 12px; height: 108px; background: #F3F4F6;
    border-radius: 999px; position: relative; overflow: hidden;
    display: flex; align-items: flex-end;
  }
  .bar-b-fill { width: 100%; border-radius: 999px; }
  .bar-label-b { font-size: 10px; color: #b0bac6; margin-top: 6px; }

  /* ─── C: 배경 강조 + 값 표시 ─── */
  .chart-c {
    height: 160px; display: flex; align-items: flex-end;
    padding: 0 2px;
  }
  .bar-group-c {
    flex: 1; display: flex; flex-direction: column;
    align-items: center;
  }
  .col-c {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 4px 0;
    border-radius: 10px; cursor: pointer;
    transition: background 0.15s;
  }
  .col-c.active { background: #EEF3FF; }
  .bars-c { display: flex; gap: 3px; align-items: flex-end; height: 100px; }
  .bar-c {
    width: 13px; border-radius: 5px 5px 2px 2px;
  }
  .bar-c.exercise { background: #93C5FD; }
  .bar-c.study { background: #2563EB; }
  .bar-label-c { font-size: 10px; color: #9ca3af; margin-top: 4px; }
  .bar-value-c { font-size: 9px; color: #6b7280; font-weight: 700; }
  .tooltip-c {
    background: #1e293b; color: white; border-radius: 8px;
    padding: 6px 10px; font-size: 11px;
    position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>

<h1>히스토그램 디자인 비교</h1>

<div class="row">

  <!-- 현재 -->
  <div class="phone-wrap">
    <span class="tag tag-current">현재</span>
    <div class="phone-label">현재 스타일</div>
    <div class="phone">
      <div class="card">
        <div class="card-title">일별 활동</div>
        <div class="chart-current">
          <svg viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg">
            <!-- grid lines -->
            <line x1="30" y1="10" x2="232" y2="10" stroke="#E7EBF0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="30" y1="37" x2="232" y2="37" stroke="#E7EBF0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="30" y1="64" x2="232" y2="64" stroke="#E7EBF0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="30" y1="91" x2="232" y2="91" stroke="#E7EBF0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="30" y1="108" x2="232" y2="108" stroke="#E7EBF0" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- axes -->
            <line x1="30" y1="10" x2="30" y2="108" stroke="#2F343A" stroke-width="1.5"/>
            <line x1="30" y1="108" x2="232" y2="108" stroke="#2F343A" stroke-width="1.5"/>
            <!-- bars: 일 -->
            <rect x="44" y="88" width="7" height="20" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="53" y="78" width="7" height="30" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 월 -->
            <rect x="72" y="58" width="7" height="50" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="81" y="48" width="7" height="60" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 화 -->
            <rect x="100" y="98" width="7" height="10" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="109" y="93" width="7" height="15" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 수 -->
            <rect x="128" y="68" width="7" height="40" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="137" y="58" width="7" height="50" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 목 -->
            <rect x="156" y="30" width="7" height="78" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="165" y="20" width="7" height="88" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 금 -->
            <rect x="184" y="78" width="7" height="30" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="193" y="68" width="7" height="40" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- 토 -->
            <rect x="212" y="83" width="7" height="25" rx="3" fill="rgba(63,124,246,0.25)"/>
            <rect x="221" y="73" width="7" height="35" rx="3" fill="rgba(63,124,246,0.6)"/>
            <!-- x labels -->
            <text x="51" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">일</text>
            <text x="79" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">월</text>
            <text x="107" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">화</text>
            <text x="135" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">수</text>
            <text x="163" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">목</text>
            <text x="191" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">금</text>
            <text x="219" y="122" font-size="9" fill="#9ca3af" text-anchor="middle">토</text>
          </svg>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:rgba(63,124,246,0.25)"></div>운동</div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(63,124,246,0.6)"></div>공부</div>
        </div>
      </div>
    </div>
  </div>

  <!-- A: 그라디언트 바 -->
  <div class="phone-wrap">
    <span class="tag tag-rec">추천</span>
    <div class="phone-label">A. 그라디언트 바</div>
    <div class="phone">
      <div class="card">
        <div class="card-title">일별 활동</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#60A5FA"></div>운동</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3D7BF4"></div>공부</div>
        </div>
        <!-- SVG 그라디언트 -->
        <svg viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:130px">
          <defs>
            <linearGradient id="gEx" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#60A5FA"/>
              <stop offset="100%" stop-color="#BFDBFE"/>
            </linearGradient>
            <linearGradient id="gSt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3D7BF4"/>
              <stop offset="100%" stop-color="#93C5FD"/>
            </linearGradient>
          </defs>
          <!-- subtle grid only -->
          <line x1="8" y1="10" x2="232" y2="10" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="38" x2="232" y2="38" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="66" x2="232" y2="66" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="94" x2="232" y2="94" stroke="#f3f4f6" stroke-width="1"/>
          <!-- 일 -->
          <rect x="16" y="77" width="13" height="17" rx="5" fill="url(#gEx)"/>
          <rect x="31" y="67" width="13" height="27" rx="5" fill="url(#gSt)"/>
          <!-- 월 -->
          <rect x="49" y="47" width="13" height="47" rx="5" fill="url(#gEx)"/>
          <rect x="64" y="37" width="13" height="57" rx="5" fill="url(#gSt)"/>
          <!-- 화 -->
          <rect x="82" y="87" width="13" height="7" rx="5" fill="url(#gEx)"/>
          <rect x="97" y="82" width="13" height="12" rx="5" fill="url(#gSt)"/>
          <!-- 수 -->
          <rect x="115" y="57" width="13" height="37" rx="5" fill="url(#gEx)"/>
          <rect x="130" y="47" width="13" height="47" rx="5" fill="url(#gSt)"/>
          <!-- 목 -->
          <rect x="148" y="17" width="13" height="77" rx="5" fill="url(#gEx)"/>
          <rect x="163" y="10" width="13" height="84" rx="5" fill="url(#gSt)"/>
          <!-- 금 -->
          <rect x="181" y="67" width="13" height="27" rx="5" fill="url(#gEx)"/>
          <rect x="196" y="57" width="13" height="37" rx="5" fill="url(#gSt)"/>
          <!-- 토 -->
          <rect x="214" y="72" width="13" height="22" rx="5" fill="url(#gEx)"/>
          <rect x="229" y="62" width="13" height="32" rx="5" fill="url(#gSt)"/>
          <!-- x labels -->
          <text x="30" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">일</text>
          <text x="63" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">월</text>
          <text x="96" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">화</text>
          <text x="129" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">수</text>
          <text x="162" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">목</text>
          <text x="195" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">금</text>
          <text x="228" y="112" font-size="9" fill="#b0bac6" text-anchor="middle">토</text>
        </svg>
      </div>
    </div>
    <div style="font-size:11px;color:#8c98a8;text-align:center;max-width:200px;line-height:1.5">
      축 선 제거 + 그라디언트.<br>가장 세련되고 깔끔한 느낌
    </div>
  </div>

  <!-- B: 트랙 스타일 -->
  <div class="phone-wrap">
    <span class="tag tag-rec">추천</span>
    <div class="phone-label">B. 트랙 + 오늘 강조</div>
    <div class="phone">
      <div class="card">
        <div class="card-title">일별 활동</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#BFDBFE;border-radius:999px"></div>운동</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3D7BF4;border-radius:999px"></div>공부</div>
        </div>
        <svg viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:130px">
          <!-- 트랙 배경 (연한 회색 전체 높이) -->
          <rect x="12" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="24" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="46" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="58" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="80" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="92" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="114" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="126" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <!-- 오늘(목) 강조 배경 -->
          <rect x="148" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="160" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="182" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="194" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="216" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <rect x="228" y="8" width="10" height="84" rx="5" fill="#F3F4F6"/>
          <!-- fills -->
          <!-- 일 -->
          <rect x="12" y="75" width="10" height="17" rx="5" fill="#BFDBFE"/>
          <rect x="24" y="65" width="10" height="27" rx="5" fill="#3D7BF4"/>
          <!-- 월 -->
          <rect x="46" y="45" width="10" height="47" rx="5" fill="#BFDBFE"/>
          <rect x="58" y="35" width="10" height="57" rx="5" fill="#3D7BF4"/>
          <!-- 화 -->
          <rect x="80" y="85" width="10" height="7" rx="5" fill="#BFDBFE"/>
          <rect x="92" y="80" width="10" height="12" rx="5" fill="#3D7BF4"/>
          <!-- 수 -->
          <rect x="114" y="55" width="10" height="37" rx="5" fill="#BFDBFE"/>
          <rect x="126" y="45" width="10" height="47" rx="5" fill="#3D7BF4"/>
          <!-- 목 (오늘 강조) -->
          <rect x="148" y="17" width="10" height="75" rx="5" fill="#93C5FD"/>
          <rect x="160" y="8" width="10" height="84" rx="5" fill="#2563EB"/>
          <!-- 오늘 뱃지 -->
          <rect x="146" y="0" width="26" height="6" rx="3" fill="#EEF3FF"/>
          <text x="159" y="5.5" font-size="5.5" fill="#3D7BF4" text-anchor="middle" font-weight="700">오늘</text>
          <!-- 금 -->
          <rect x="182" y="65" width="10" height="27" rx="5" fill="#BFDBFE"/>
          <rect x="194" y="55" width="10" height="37" rx="5" fill="#3D7BF4"/>
          <!-- 토 -->
          <rect x="216" y="70" width="10" height="22" rx="5" fill="#BFDBFE"/>
          <rect x="228" y="60" width="10" height="32" rx="5" fill="#3D7BF4"/>
          <!-- x labels -->
          <text x="22" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">일</text>
          <text x="56" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">월</text>
          <text x="90" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">화</text>
          <text x="124" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">수</text>
          <text x="158" y="104" font-size="9" fill="#2563EB" font-weight="700" text-anchor="middle">목</text>
          <text x="192" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">금</text>
          <text x="226" y="104" font-size="9" fill="#b0bac6" text-anchor="middle">토</text>
        </svg>
      </div>
    </div>
    <div style="font-size:11px;color:#8c98a8;text-align:center;max-width:200px;line-height:1.5">
      회색 트랙 + 색상 채우기.<br>오늘 날짜 자동 강조
    </div>
  </div>

  <!-- C: 단일 스택 바 -->
  <div class="phone-wrap">
    <span class="tag tag-alt">대안</span>
    <div class="phone-label">C. 스택 바 + 값 표시</div>
    <div class="phone">
      <div class="card">
        <div class="card-title">일별 활동</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#93C5FD"></div>운동</div>
          <div class="legend-item"><div class="legend-dot" style="background:#2563EB"></div>공부</div>
        </div>
        <svg viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:130px">
          <!-- 최댓값 표시선 -->
          <line x1="8" y1="14" x2="232" y2="14" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="42" x2="232" y2="42" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="70" x2="232" y2="70" stroke="#f3f4f6" stroke-width="1"/>
          <line x1="8" y1="92" x2="232" y2="92" stroke="#f3f4f6" stroke-width="1"/>
          <!-- 스택 바: 일 -->
          <rect x="16" y="72" width="18" height="20" rx="4" fill="#93C5FD"/>
          <rect x="16" y="55" width="18" height="17" rx="0" fill="#2563EB"/>
          <rect x="16" y="52" width="18" height="6" rx="4" fill="#2563EB"/>
          <!-- 월 -->
          <rect x="49" y="45" width="18" height="47" rx="4" fill="#93C5FD"/>
          <rect x="49" y="22" width="18" height="23" rx="0" fill="#2563EB"/>
          <rect x="49" y="18" width="18" height="8" rx="4" fill="#2563EB"/>
          <!-- 화 -->
          <rect x="82" y="84" width="18" height="8" rx="4" fill="#93C5FD"/>
          <rect x="82" y="78" width="18" height="6" rx="0" fill="#2563EB"/>
          <rect x="82" y="76" width="18" height="4" rx="4" fill="#2563EB"/>
          <!-- 수 -->
          <rect x="115" y="55" width="18" height="37" rx="4" fill="#93C5FD"/>
          <rect x="115" y="35" width="18" height="20" rx="0" fill="#2563EB"/>
          <rect x="115" y="31" width="18" height="7" rx="4" fill="#2563EB"/>
          <!-- 목 -->
          <rect x="148" y="50" width="18" height="42" rx="4" fill="#93C5FD"/>
          <rect x="148" y="18" width="18" height="32" rx="0" fill="#2563EB"/>
          <rect x="148" y="14" width="18" height="8" rx="4" fill="#2563EB"/>
          <!-- 값 표시 -->
          <text x="157" y="11" font-size="8" fill="#2563EB" text-anchor="middle" font-weight="700">90분</text>
          <!-- 금 -->
          <rect x="181" y="65" width="18" height="27" rx="4" fill="#93C5FD"/>
          <rect x="181" y="48" width="18" height="17" rx="0" fill="#2563EB"/>
          <rect x="181" y="44" width="18" height="7" rx="4" fill="#2563EB"/>
          <!-- 토 -->
